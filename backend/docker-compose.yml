services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: institute_accounts
      MYSQL_ROOT_PASSWORD: accounts
    ports:
      - "3306:3306"
    volumes:
      - accounts_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-paccounts"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  accounts_mysql_data:
